<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPV Sync</title>
<style>
  /* "Premiere native": compact outlined buttons, small section labels, thin bar, results table */
  :root { --bg:#1e1e1e; --text:#c8c8c8; --bright:#e6e6e6; --muted:#7a7a7a; --line:#2c2c2c;
          --btn:#2a2a2a; --btn-line:#3c3c3c; --accent:#2680eb; --accent-bg:#1f4f86;
          --ok:#4fb46b; --warn:#d9a640; --bad:#d65a5a; }
  html, body { margin:0; background:var(--bg); color:var(--text);
               font:12px/1.45 "Segoe UI", system-ui, sans-serif; }
  .wrap { padding:10px; }
  .lbl { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:12px 0 6px; }
  .lbl:first-child { margin-top:2px; }
  .btns { display:flex; flex-direction:column; gap:4px; }
  button { display:flex; align-items:center; gap:8px; width:100%; height:28px; padding:0 10px;
           border:1px solid var(--btn-line); border-radius:3px; background:var(--btn); color:#d0d0d0;
           font:12px "Segoe UI", sans-serif; text-align:left; cursor:pointer; }
  button:hover { border-color:#555; background:#303030; }
  button svg { flex:0 0 16px; color:#6aa9ff; }
  button.primary { border-color:var(--accent); background:var(--accent-bg); color:#fff; }
  button.primary:hover { background:#245c9c; }
  button.primary svg { color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  .menu-help { font-size:11px; color:var(--muted); margin:10px 0 2px; line-height:1.5; }
  .help { font-size:11px; color:var(--muted); }
  .help p { margin:0 0 6px; }
  .help b { color:var(--text); font-weight:600; }
  .track { height:4px; background:#333; border-radius:2px; overflow:hidden; }
  #fill { height:100%; width:0; background:var(--accent); transition:width .3s ease; }
  #progress.failed #fill { background:var(--bad); }
  #progress.done #fill { background:var(--ok); }
  .meta { display:flex; justify-content:space-between; gap:8px; margin-top:5px; font-size:11px; }
  #plabel { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta .r { color:var(--muted); white-space:nowrap; }
  #pct { color:var(--text); }
  .meta .stoplink { display:inline-flex; align-items:center; gap:4px; width:auto; height:auto; padding:0;
                    margin-left:10px; border:none; background:none; color:#e07a7a; font-size:11px; }
  .meta .stoplink:hover { background:none; color:#ff9a9a; }
  .meta .stoplink svg { flex:0 0 11px; width:11px; height:11px; color:inherit; }
  .meta .stoplink[hidden] { display:none; }
  #status { margin:8px 0 0; font-size:11px; }
  #status:empty { display:none; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  td { padding:5px 2px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.st { text-align:right; white-space:nowrap; padding-left:8px; }
  td b { color:var(--bright); font-weight:600; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .sub { color:var(--muted); }
  .ok { color:var(--ok); } .dot.ok { background:var(--ok); }
  .warn { color:var(--warn); } .dot.warn { background:var(--warn); }
  .bad { color:var(--bad); } .dot.bad { background:var(--bad); }
  #plabel b { color:var(--bright); font-weight:600; }
  /* camera picker */
  .cam { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:11px; }
  .cam .nm { flex:1; min-width:0; }
  .cam .nm b { color:var(--bright); font-weight:600; }
  .cam .why { display:block; color:var(--muted); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cam .why i { color:#b49a5a; font-style:normal; }
  select.role { flex:0 0 96px; height:22px; border:1px solid #3c3c3c; border-left-width:3px; border-radius:3px;
                background:#2a2a2a; color:#e6e6e6; font:11px "Segoe UI", sans-serif; padding:0 4px; }
  select.role.dvr { border-left-color:#d9a640; } select.role.hd { border-left-color:#2680eb; }
  select.role.stick { border-left-color:#9b6ad6; } select.role.leave { border-left-color:#555; color:#999; }
  select.role.none { border-color:#7a6a3a; border-left-color:#d9a640; color:#d9c38a; }
  .camnote { color:var(--muted); font-size:10.5px; margin:7px 0 8px; }
  #camwhy { color:#d9c38a; font-size:11px; margin-top:6px; }
  .empty { display:flex; gap:10px; align-items:center; margin:6px 0 2px; padding:12px 12px; border:1px dashed #6b5a2a;
           border-radius:4px; background:#26221a; color:#e0c27a; }
  .empty svg { flex:0 0 22px; width:22px; height:22px; color:#d9a640; }
  .empty b { display:block; color:#f0d48a; font-weight:600; font-size:12px; }
  .empty span { display:block; color:#a8946a; font-size:10.5px; margin-top:2px; }
  .empty.info { border-color:#3c4a5c; background:#1d232b; color:#a9c0da; }
  .empty.info svg { color:#6aa9ff; } .empty.info b { color:#cfe0f5; } .empty.info span { color:#7f93aa; }
  #camwhy:empty { display:none; }
  /* PiP Layout: tickbox (Match & Sync, Sync) or settings (PiP Layout), rows + draggable preview */
  .pipbox { margin:10px 0 8px; border:1px solid var(--line); border-radius:4px; background:#191919; }
  .pipbox > label { display:flex; align-items:center; gap:8px; padding:8px 10px; color:var(--bright); font-size:11.5px; cursor:pointer; }
  .pipbox > label input { width:14px; height:14px; accent-color:#2680eb; margin:0; }
  .pipbox .body { padding:0 10px 10px; }
  .pipbox.off .body { display:none; }
  .pipbox.plain { border:none; background:none; }
  .pipbox.plain .body { padding:0; }
  .pipgrid { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .piprows { flex:1 1 280px; display:flex; flex-direction:column; gap:6px; }
  .crow { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#1c1c1c; font-size:11px; }
  .crow .who { flex:0 0 74px; color:var(--bright); display:flex; align-items:center; gap:6px; }
  .crow input { width:58px; height:22px; border:1px solid #3c3c3c; border-radius:3px; background:#2a2a2a; color:#e6e6e6;
                font:11px "Segoe UI", sans-serif; padding:0 4px; text-align:right; }
  .crow .dim { color:var(--muted); white-space:nowrap; }
  .crow .hint { color:var(--muted); font-size:10.5px; margin-left:auto; text-align:right; }
  .pipnote { color:var(--muted); font-size:10.5px; margin-top:6px; }
  .preview { position:relative; flex:0 0 auto; border:1px solid #3c3c3c; border-radius:3px; background:linear-gradient(135deg,#2b3440,#1d2229);
             user-select:none; touch-action:none; }
  .preview .tag { position:absolute; top:3px; left:50%; transform:translateX(-50%); font-size:9px; color:#7f93aa; white-space:nowrap; }
  .preview .pip { position:absolute; border:1.5px solid; border-radius:2px; font-size:9px; display:flex; align-items:center;
                  justify-content:center; cursor:grab; z-index:2; }
  .preview .pip.dvr { border-color:#d9a640; background:rgba(217,166,64,.18); color:#f0d48a; }
  .preview .pip.stick { border-color:#9b6ad6; background:rgba(155,106,214,.18); color:#d6c0f5; }
  .preview .pip.dragging { cursor:grabbing; box-shadow:0 4px 14px rgba(0,0,0,.6); opacity:.92; z-index:4; }
  .preview .ghost { position:absolute; border:1.5px dashed #b48ae6; border-radius:2px; z-index:1; pointer-events:none; }
  .preview .snap { position:absolute; width:7px; height:7px; margin:-3.5px 0 0 -3.5px; border-radius:50%;
                   background:rgba(255,255,255,.28); z-index:3; pointer-events:none; }
  .preview .snap.on { width:11px; height:11px; margin:-5.5px 0 0 -5.5px; background:#b48ae6; box-shadow:0 0 0 3px rgba(180,138,230,.3); }
  .camrow { display:flex; gap:6px; align-items:center; }
  .camrow button { justify-content:center; }
  .camrow .link { width:auto; height:auto; border:none; background:none; color:var(--muted); padding:0 4px; font-size:11px; }
  .camrow .link:hover { color:var(--text); background:none; }
  /* live counters + file list */
  .tl { font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:#666; margin:9px 0 3px; }
  .tiles { display:flex; gap:4px; margin-top:4px; }
  .tile { flex:1; border:1px solid var(--line); border-radius:3px; background:#191919; padding:5px 6px 4px; }
  .tile .v { font-size:17px; line-height:20px; color:var(--bright); font-weight:600; }
  .tile .v small { font-size:11px; color:var(--muted); font-weight:400; }
  .tile .k { font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .tile.ok .v { color:#7fd096; } .tile.bad .v { color:#e08a8a; }
  .sw { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; vertical-align:1px; }
  .sw.dvr { background:#d9a640; } .sw.hd { background:#2680eb; } .sw.stick { background:#9b6ad6; }
  #files { margin-top:8px; font-size:11px; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; align-items:start; }
  .col .tile { margin-bottom:4px; }
  .grp { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:8px 0 3px; }
  .row { padding:4px 5px; border-radius:3px; border-bottom:1px solid var(--line); }
  .row.cur { background:#1f2c3d; }
  .row { position:relative; cursor:pointer; }
  .row:hover { background:#232a33; }
  .row.cur:hover { background:#22324a; }
  .row.picked { outline:1.5px solid #6aa9ff; outline-offset:-1px; background:#1d2a3a; }
  .row .acts { position:absolute; top:3px; right:3px; display:flex; gap:3px; }
  .row .ib { width:20px; height:18px; display:inline-flex; align-items:center; justify-content:center; border-radius:3px;
             color:#8fa7c2; border:1px solid transparent; }
  .row .ib:hover { border-color:#3c3c3c; background:#2a2a2a; }
  .row .ib svg { width:11px; height:11px; }
  .row .ib.skip { color:#9a8080; }
  .row .ib.undo { color:#f0c070; border-color:#6b5a2a; background:#2a2518; }
  .row .n { padding-right:46px; }
  .row.skipped .n, .row.skipped .chips, .row.skipped .ib.show { opacity:.3; }
  button.snd { width:auto; height:22px; flex:0 0 auto; padding:0 8px; gap:5px; font-size:10.5px; margin-right:6px;
               border:1px solid #3c3c3c; background:#2a2a2a; color:#dfe7f0; }
  button.snd svg { width:12px; height:12px; flex:0 0 12px; color:inherit; }
  button.snd.off { color:#8a8a8a; }
  .row .n { color:var(--bright); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:2px; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; }
  .chip { font-size:10px; padding:0 5px; border-radius:8px; line-height:16px; border:1px solid #3a3a3a; color:#8a8a8a; white-space:nowrap; }
  .chip.ok { border-color:#2f5d3b; color:#7fd096; background:#1c2a20; }
  .chip.bad { border-color:#5d2f2f; color:#e08a8a; background:#2a1c1c; }
  .chip.run { border-color:#2d5a92; color:#a9cdfa; background:#1b2840; }
  .chip.warn { border-color:#6b5a2a; color:#e0c27a; background:#2a2518; white-space:normal; }
  pre { white-space:pre-wrap; color:var(--muted); font-size:10px; margin:10px 0 0; }
  pre:empty { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lbl">Actions</div>
  <div class="btns">
    <button id="build"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M4 17h10"/><path d="M14 4l3 3-3 3M14 14l3 3-3 3"/><circle cx="20" cy="7" r="1.5"/><circle cx="20" cy="17" r="1.5"/></svg>Match &amp; Sync</button>
    <button id="sync"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Sync</button>
    <button id="place"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="12" width="7" height="6" rx="1" fill="currentColor"/></svg>PiP Layout</button>
  </div>

  <div id="actionhelp" class="menu-help"></div>

  <div id="cams">
    <div class="lbl">Cameras in the selection</div>
    <div id="camlist"></div>
    <div class="camnote">Each camera keeps the role you give it (per resolution): next time it is filled in.
      Unknown source = no camera name found.</div>
    <div id="pipbox"></div>
    <div class="camrow"><button id="camgo" class="primary">Start matching</button></div>
    <div id="camwhy"></div>
  </div>

  <div id="progress" hidden>
    <div class="lbl">Progress</div>
    <div class="track"><div id="fill"></div></div>
    <div class="meta"><span id="plabel"></span><span class="r"><span id="pct">0%</span><span id="ptime"></span><button id="stop" class="stoplink" hidden title="Stop: line up what's analysed so far"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span id="stoptxt">Stop</span></button></span></div>
    <div id="livebox" hidden><div id="tiles"></div><div id="files"></div></div>
  </div>
  <div id="status"></div>

  <pre id="log"></pre>
</div>
<script src="main.js"></script>
</body>
</html>
